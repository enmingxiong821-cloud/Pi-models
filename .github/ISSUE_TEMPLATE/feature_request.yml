name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，避免重复建议。涉及密钥、网络请求或写盘行为时，
        请一并说明你期望的安全边界。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？在什么场景下会遇到？
      placeholder: 例如：每次切换模型后都要手动执行 pmh sync
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望命令、参数或交互变成什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - pmh CLI
        - pi 扩展（/switch、自动路由）
        - 安装脚本
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索已有 Issue
          required: true
        - label: 建议中没有包含真实 API Key 或站点地址
          required: true
