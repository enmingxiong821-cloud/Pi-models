name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已推送的 tag，例如 v0.7.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: desktop:dist:win
            artifacts: |
              release/*.exe
              release/*.blockmap
          - name: macos
            os: macos-latest
            script: desktop:dist:mac
            artifacts: |
              release/*.dmg
              release/*-mac-*.zip
          - name: linux
            os: ubuntu-latest
            script: desktop:dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 全量自测
        run: npm test

      - name: 构建桌面端
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: pmh-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release 并上传各平台产物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pmh $TAG" \
              --notes "### 桌面端
- Windows x64：安装版（setup）与便携版（portable）
- macOS：Intel / Apple 芯片，dmg 与 zip
- Linux x64：AppImage 与 deb

### CLI
- Windows：install.ps1
- macOS / Linux：install.sh
- 也可以使用 npm i -g pmh-cli

桌面端未做代码签名。macOS 首次打开请右键 → 打开；Linux 的 AppImage 需要先 chmod +x。完整更新内容见 CHANGELOG.md。"
          fi
          find dist -type f \( \
            -name '*.exe' -o -name '*.blockmap' -o \
            -name '*.dmg' -o -name '*.zip' -o \
            -name '*.AppImage' -o -name '*.deb' \
          \) -print0 | xargs -0 gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
