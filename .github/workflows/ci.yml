name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 全量自测（进程内打桩，不依赖网络与 pi）
        run: npm test

      - name: 安装器自测（macOS / Linux）
        if: runner.os != 'Windows'
        run: sh ./install.sh --no-setup --no-path --dir "$RUNNER_TEMP/pmh-install"

      - name: 安装器自测（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -NoSetup -NoPath -Dir "$env:RUNNER_TEMP/pmh-install"
